<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://minesweeper.jaime-gaming.com/">
<meta id="meta-description" name="description" content="Buscaminas de bloques en blanco y negro: la historia de un recluta en treinta campos minados. Tres dificultades, banderas y récords locales.">
<title>minesweeper.</title>
<script>
  (function () {
    var base = location.protocol === 'file:' ? './' : '/';
    document.write('<base href="' + base + '">');
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E<rect x='5' y='5' width='6' height='6' fill='%23f2f2f2'/><rect x='4' y='6' width='8' height='4' fill='%23f2f2f2'/><rect x='6' y='4' width='4' height='8' fill='%23f2f2f2'/><rect x='7' y='2' width='2' height='2' fill='%23f2f2f2'/><rect x='7' y='12' width='2' height='2' fill='%23f2f2f2'/><rect x='2' y='7' width='2' height='2' fill='%23f2f2f2'/><rect x='12' y='7' width='2' height='2' fill='%23f2f2f2'/><rect x='3' y='3' width='1.5' height='1.5' fill='%23f2f2f2'/><rect x='11.5' y='3' width='1.5' height='1.5' fill='%23f2f2f2'/><rect x='3' y='11.5' width='1.5' height='1.5' fill='%23f2f2f2'/><rect x='11.5' y='11.5' width='1.5' height='1.5' fill='%23f2f2f2'/><rect x='6' y='6' width='2' height='1' fill='%23ffffff'/><rect x='5' y='7' width='1' height='1' fill='%23ffffff'/><rect x='9' y='9' width='2' height='2' fill='%23000000' opacity='0.3'/>%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=20">
<link rel="preload" href="audio/Ambience.mp3" as="fetch" crossorigin>
<link rel="preload" href="audio/Boom.mp3" as="fetch" crossorigin>
<link rel="preload" href="audio/Win.mp3" as="fetch" crossorigin>
<link rel="preload" href="audio/Death.mp3" as="fetch" crossorigin>
</head>
<body data-screen="home">
  <div id="app">
    <header id="topbar">
      <span class="brand">minesweeper<span class="dot">.</span><svg class="brand-bomb" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="5" y="5" width="6" height="6" fill="#f2f2f2"/><rect x="4" y="6" width="8" height="4" fill="#f2f2f2"/><rect x="6" y="4" width="4" height="8" fill="#f2f2f2"/><rect x="7" y="2" width="2" height="2" fill="#f2f2f2"/><rect x="7" y="12" width="2" height="2" fill="#f2f2f2"/><rect x="2" y="7" width="2" height="2" fill="#f2f2f2"/><rect x="12" y="7" width="2" height="2" fill="#f2f2f2"/><rect x="3" y="3" width="1.5" height="1.5" fill="#f2f2f2"/><rect x="11.5" y="3" width="1.5" height="1.5" fill="#f2f2f2"/><rect x="3" y="11.5" width="1.5" height="1.5" fill="#f2f2f2"/><rect x="11.5" y="11.5" width="1.5" height="1.5" fill="#f2f2f2"/><rect x="6" y="6" width="2" height="1" fill="#ffffff"/><rect x="5" y="7" width="1" height="1" fill="#ffffff"/><rect x="9" y="9" width="2" height="2" fill="#000000" opacity="0.3"/></svg></span>
      <div class="stats">
        <span id="hud-meta" class="meta">cargando…</span>
        <span id="hud-score" class="score">—</span>
        <span id="hud-timer" class="timer"></span>
        <span id="hud-best" class="best"></span>
      </div>
      <div class="tools">
        <label class="language-control">
          <span class="sr-only" data-i18n="language">Idioma</span>
          <select id="lang-switch" data-i18n-aria="language" aria-label="Idioma">
            <option value="es">ES</option>
            <option value="en">EN</option>
          </select>
        </label>
      </div>
    </header>

    <main id="stage">
      <canvas id="board" data-i18n-aria="board" aria-label="tablero"></canvas>
      <div id="senal" data-i18n="startSignal">despeja el campo</div>
      <button id="flag-toggle" type="button" hidden aria-pressed="false" data-i18n-aria="flagMode" aria-label="poner banderas al tocar">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 15V2h1.6v3.4H12l-2.4 3.2L12 11.8H4.6V15H3z" fill="currentColor"/></svg>
      </button>
      <div id="overlay"></div>
      <div id="luto" aria-hidden="true"></div>
    </main>

    <p id="aviso-foco" data-i18n="focusHint" hidden>toca el tablero para despertar el teclado</p>

    <footer id="footer">
      <div class="foot-row">
        <p id="hint"></p>
      </div>
    </footer>
  </div>

  <div id="flash" aria-hidden="true"></div>
  <canvas id="barrido" hidden aria-hidden="true"></canvas>
  <canvas id="ruido" hidden aria-hidden="true"></canvas>
  <canvas id="lupa" hidden aria-hidden="true"></canvas>

  <div id="fatal" hidden role="alert">
    <p class="fatal-title" data-i18n="fatalTitle">el juego no ha arrancado</p>
    <p id="fatal-text" class="fatal-text"></p>
    <p class="fatal-actions">
      <button type="button" id="fatal-reload" data-i18n="fatalReload">recargar limpio</button>
    </p>
  </div>

  <noscript>
    <div id="sin-js" data-i18n="noScript">este juego necesita su motor en marcha.</div>
  </noscript>

  <script>
    (function () {
      var caja = document.getElementById('fatal');
      var texto = document.getElementById('fatal-text');
      var arrancado = false;

      function fallo(mensaje) {
        if (!caja || arrancado) return;
        texto.textContent = mensaje;
        caja.hidden = false;
      }

      window.__minesweeperFallo = fallo;
      window.__minesweeperArrancado = function () {
        arrancado = true;
        document.documentElement.dataset.booted = '1';
        if (caja) caja.hidden = true;
      };

      window.addEventListener('error', function (evento) {
        var objetivo = evento.target || {};
        if (objetivo.tagName === 'SCRIPT' || objetivo.tagName === 'LINK') {
          fallo('no se pudo colocar una pieza del tablero.');
          return;
        }
        fallo(evento.message || 'el tablero ha perdido el trazo.');
      }, true);

      window.addEventListener('unhandledrejection', function () {
        fallo('el tablero ha hecho un movimiento imposible.');
      });

      document.getElementById('fatal-reload').addEventListener('click', function () {
        location.replace(location.pathname + '?v=' + Date.now());
      });

      setTimeout(function () {
        if (!document.documentElement.dataset.booted) {
          fallo('el tablero no ha despertado en 4 s. vuelve a abrirlo.');
        }
      }, 4000);
    })();
  </script>

  <script src="minesweeper.js?v=20"></script>
</body>
</html>
